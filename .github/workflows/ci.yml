name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install --yes shellcheck
          shellcheck --external-sources --source-path=mongo/scripts \
            mongo/scripts/entrypoint.sh mongo/scripts/lib/*.sh
          shellcheck --external-sources tests/e2e.sh

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Exercises the real failure modes — a regenerated password, a renamed
      # service, a missing volume — against a live node.
      - name: Run the end-to-end scenarios
        run: ./tests/e2e.sh
